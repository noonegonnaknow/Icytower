name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "IcyTower"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=false
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.icytower"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.icytower"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Icy Tower"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/example/icytower/MainActivity.kt)
          cat > app/src/main/java/com/example/icytower/MainActivity.kt <<'EOF_FILE'
          package com.example.icytower

          import android.app.Activity
          import android.os.Bundle
          import android.view.WindowManager

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(GameView(this))
              }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/example/icytower/GameView.kt)
          cat > app/src/main/java/com/example/icytower/GameView.kt <<'EOF_FILE'
          package com.example.icytower

          import android.content.Context
          import android.graphics.*
          import android.view.MotionEvent
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.random.Random

          class GameView(ctx: Context) : SurfaceView(ctx), SurfaceHolder.Callback, Runnable {

              private class Plat(val x: Float, val y: Float, val w: Float)

              private val W = 480f              // логическая ширина мира
              private var H = 800f              // логическая высота (считается от экрана)
              private var scale = 1f
              private val pw = 30f
              private val ph = 44f
              private val plats = ArrayList<Plat>()
              private var px = 0f; private var py = 0f
              private var vx = 0f; private var vy = 0f
              private var camY = 0f
              private var groundY = 0f
              private var lastY = 0f
              private var started = false
              private var dead = false
              private var onGround = false
              private var best = 0
              private var score = 0

              private var leftHeld = false
              private var rightHeld = false
              private var jumpHeld = false

              private var thread: Thread? = null
              @Volatile private var running = false
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
              private val btnL = RectF(); private val btnR = RectF(); private val btnJ = RectF()

              init { holder.addCallback(this) }

              override fun surfaceCreated(h: SurfaceHolder) {
                  running = true
                  thread = Thread(this).also { it.start() }
              }

              override fun surfaceChanged(h: SurfaceHolder, f: Int, w: Int, hh: Int) {
                  scale = w / W
                  H = hh / scale
                  val bs = w * 0.2f
                  val m = w * 0.04f
                  btnL.set(m, hh - bs - m, m + bs, hh - m)
                  btnR.set(m * 2 + bs, hh - bs - m, m * 2 + bs * 2, hh - m)
                  btnJ.set(w - bs * 1.3f - m, hh - bs * 1.3f - m, w - m, hh - m)
                  reset()
              }

              override fun surfaceDestroyed(h: SurfaceHolder) {
                  running = false
                  thread?.join()
              }

              private fun reset() {
                  plats.clear()
                  groundY = H - 60f
                  plats.add(Plat(0f, groundY, W))
                  lastY = groundY
                  px = W / 2 - pw / 2; py = groundY
                  vx = 0f; vy = 0f
                  camY = 0f
                  started = false; dead = false; score = 0
              }

              override fun run() {
                  var last = System.nanoTime()
                  var acc = 0f
                  val step = 1f / 60f
                  while (running) {
                      val now = System.nanoTime()
                      acc += (now - last) / 1e9f
                      last = now
                      if (acc > 0.1f) acc = 0.1f
                      while (acc >= step) { update(step); acc -= step }
                      val c = holder.lockCanvas()
                      if (c == null) { Thread.sleep(10); continue }
                      try { render(c) } finally { holder.unlockCanvasAndPost(c) }
                      Thread.sleep(4)
                  }
              }

              private fun update(dt: Float) {
                  if (dead) return

                  // управление
                  val dir = (if (rightHeld) 1 else 0) - (if (leftHeld) 1 else 0)
                  if (dir != 0) vx += dir * 1500f * dt
                  else {
                      val f = 900f * dt
                      vx = if (abs(vx) <= f) 0f else vx - kotlin.math.sign(vx) * f
                  }
                  vx = vx.coerceIn(-430f, 430f)

                  // прыжок: чем быстрее бежишь, тем выше
                  if (onGround && jumpHeld) {
                      vy = -(650f + abs(vx) * 0.6f)
                      onGround = false
                  }

                  vy += 1800f * dt
                  val prevFeet = py
                  px += vx * dt
                  py += vy * dt

                  // отскок от стен
                  if (px < 0f) { px = 0f; vx = abs(vx) * 0.9f }
                  if (px > W - pw) { px = W - pw; vx = -abs(vx) * 0.9f }

                  // посадка на платформы
                  onGround = false
                  if (vy >= 0f) {
                      for (p in plats) {
                          if (prevFeet <= p.y && py >= p.y && px + pw > p.x && px < p.x + p.w) {
                              py = p.y; vy = 0f; onGround = true
                              break
                          }
                      }
                  }

                  // камера
                  if (py < groundY - 50f) started = true
                  val height = (groundY - py).toInt()
                  score = max(score, height / 10)
                  val top = py - H * 0.4f
                  if (top < camY) camY = top
                  if (started) camY -= (30f + min(score * 0.6f, 220f)) * dt

                  // генерация и очистка платформ
                  while (lastY > camY - 300f) {
                      lastY -= 100f
                      val w = max(70f, 160f - score * 0.15f)
                      plats.add(Plat(Random.nextFloat() * (W - w), lastY, w))
                  }
                  plats.removeAll { it.y > camY + H + 100f }

                  if (py - camY > H + 50f) {
                      dead = true
                      best = max(best, score)
                  }
              }

              private fun render(c: Canvas) {
                  c.drawColor(Color.rgb(20, 28, 60))
                  c.save()
                  c.scale(scale, scale)
                  c.translate(0f, -camY)

                  paint.style = Paint.Style.FILL
                  for (p in plats) {
                      paint.color = Color.rgb(160, 220, 255)
                      c.drawRect(p.x, p.y, p.x + p.w, p.y + 14f, paint)
                      paint.color = Color.WHITE
                      c.drawRect(p.x, p.y, p.x + p.w, p.y + 4f, paint)
                  }
                  // игрок
                  paint.color = Color.rgb(255, 140, 0)
                  c.drawRect(px, py - ph, px + pw, py, paint)
                  paint.color = Color.WHITE
                  c.drawRect(px + 6f, py - ph + 8f, px + 13f, py - ph + 16f, paint)
                  c.drawRect(px + 18f, py - ph + 8f, px + 25f, py - ph + 16f, paint)
                  c.restore()

                  // HUD
                  paint.color = Color.WHITE
                  paint.textSize = 48f
                  paint.textAlign = Paint.Align.LEFT
                  c.drawText("Высота: $score", 24f, 70f, paint)
                  paint.textSize = 32f
                  c.drawText("Рекорд: $best", 24f, 110f, paint)

                  // кнопки
                  paint.color = Color.argb(110, 255, 255, 255)
                  c.drawRoundRect(btnL, 24f, 24f, paint)
                  c.drawRoundRect(btnR, 24f, 24f, paint)
                  c.drawRoundRect(btnJ, 24f, 24f, paint)
                  paint.color = Color.WHITE
                  paint.textAlign = Paint.Align.CENTER
                  paint.textSize = 56f
                  c.drawText("◀", btnL.centerX(), btnL.centerY() + 20f, paint)
                  c.drawText("▶", btnR.centerX(), btnR.centerY() + 20f, paint)
                  paint.textSize = 40f
                  c.drawText("ПРЫЖОК", btnJ.centerX(), btnJ.centerY() + 14f, paint)

                  if (dead) {
                      paint.color = Color.argb(170, 0, 0, 0)
                      c.drawRect(0f, 0f, width.toFloat(), height.toFloat(), paint)
                      paint.color = Color.WHITE
                      paint.textSize = 90f
                      c.drawText("Игра окончена", width / 2f, height / 2f - 40f, paint)
                      paint.textSize = 48f
                      c.drawText("Высота: $score", width / 2f, height / 2f + 30f, paint)
                      c.drawText("Тапни, чтобы начать заново", width / 2f, height / 2f + 100f, paint)
                  }
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  if (dead) {
                      if (e.actionMasked == MotionEvent.ACTION_DOWN) reset()
                      return true
                  }
                  var l = false; var r = false; var j = false
                  if (e.actionMasked != MotionEvent.ACTION_UP && e.actionMasked != MotionEvent.ACTION_CANCEL) {
                      val skip = if (e.actionMasked == MotionEvent.ACTION_POINTER_UP) e.actionIndex else -1
                      for (i in 0 until e.pointerCount) {
                          if (i == skip) continue
                          val x = e.getX(i); val y = e.getY(i)
                          if (btnL.contains(x, y)) l = true
                          if (btnR.contains(x, y)) r = true
                          if (btnJ.contains(x, y)) j = true
                      }
                  }
                  leftHeld = l; rightHeld = r; jumpHeld = j
                  return true
              }
          }
          EOF_FILE
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: IcyTower-apk
          path: app/build/outputs/apk/debug/app-debug.apk
